- type: entity
  parent: Clothing
  id: IDCardTaipanStandard
  name: taipan identification card
  description: A card necessary to access various areas aboard the taipan.
  abstract: true
  components:
  - type: Sprite
    sprite: _Divided-Space/Objects/Misc/Taipan/id_cards.rsi
  - type: Clothing
    slots:
    - idcard
    sprite: _Divided-Space/Objects/Misc/Taipan/id_cards.rsi
  - type: Item
    size: Small
    heldPrefix: default
    storedRotation: -90
  - type: Access
  - type: IdCard
  - type: StationRecordKeyStorage
  - type: Tag
    tags:
    - DoorBumpOpener
    - WhitelistChameleon

- type: entity
  parent: IDCardTaipanStandard
  id: TaipanRecruitIDCard
  name: taipan recruit ID card
  components:
  - type: Sprite
    layers:
    - state: idtaipan
    - state: idtaipanrecruit
  - type: PresetIdCard
    job: TaipanRecruit

