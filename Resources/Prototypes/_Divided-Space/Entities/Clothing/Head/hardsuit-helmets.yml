#Stalker Hardsuit
- type: entity
  parent: [ ClothingHeadHardsuitWithLightBase]
  id: ClothingHeadHelmetHardsuitStalker
  categories: [ HideSpawnMenu ]
  name: cybersun stalker helmet
  description: Packed with advanced military electronics, perfect for searching and intimidating.
  components:
  - type: Sprite
    sprite: _Divided-Space/Clothing/Head/Hardsuits/stalker_cybersun.rsi
  - type: Clothing
    sprite: _Divided-Space/Clothing/Head/Hardsuits/stalker_cybersun.rsi
  - type: PointLight
    color: "#ff467a"
  - type: PressureProtection
    highPressureMultiplier: 0.08
    lowPressureMultiplier: 1000
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9
        Heat: 0.7
  - type: FlashImmunity
  - type: EyeProtection
  - type: Tag
    tags:
    - WhitelistChameleon

