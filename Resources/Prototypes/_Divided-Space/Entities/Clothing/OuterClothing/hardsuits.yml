#Stalker Hardsuit
- type: entity
  parent: [ClothingOuterHardsuitBase, BaseSyndicateContraband]
  id: ClothingOuterHardsuitStalker
  name: cybersun stalker suit
  description: The latest armored hardsuit from Cybersun advanced R&D division. It has not yet entered mass production and may not even be patented.
  components:
  - type: Sprite
    sprite: _Divided-Space/Clothing/OuterClothing/Hardsuits/stalker_cybersun.rsi
  - type: Clothing
    sprite: _Divided-Space/Clothing/OuterClothing/Hardsuits/stalker_cybersun.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.02
    lowPressureMultiplier: 1000
  - type: ExplosionResistance
    damageCoefficient: 0.6
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.5
        Slash: 0.4
        Piercing: 0.3
        Heat: 0.7
        Radiation: 0.8
        Caustic: 0.4
        Bloodloss: 0.5
  - type: ClothingSlowOnDamageModifier
    modifier: 0.5
  - type: ClothingSpeedModifier
    walkModifier: 1
    sprintModifier: 1.1
  - type: HeldSpeedModifier
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetHardsuitStalker
  - type: Tag
    tags:
    - Hardsuit
    - WhitelistChameleon

# GORLEX HARDSUITS

#Gorlex Phanthom Suit
- type: entity
  parent: [ClothingOuterHardsuitBase, BaseToggleClothing]
  id: ClothingOuterHardsuitGorlexPhantom
  name: gorlex phanthom suit
  description: Seeing it for the first time? As expected...
  components:
  - type: Sprite
    sprite: _Divided-Space/Clothing/OuterClothing/Hardsuits/gorlex_phanthom.rsi
  - type: Clothing
    sprite: _Divided-Space/Clothing/OuterClothing/Hardsuits/gorlex_phanthom.rsi
  - type: Item
    size: Huge
  - type: PressureProtection
    highPressureMultiplier: 0.525
    lowPressureMultiplier: 10000
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.5
        Slash: 0.5
        Piercing: 0.4
        Heat: 0.5
        Radiation: 0.7
        Caustic: 0.6
        Bloodloss: 0.5
  - type: ExplosionResistance
    damageCoefficient: 0.6
  - type: ClothingSlowOnDamageModifier
    modifier: 0.75
  # phase cloak
  - type: ToggleClothing
    action: ActionTogglePhaseCloak
  - type: ComponentToggler
    parent: true
    components:
    - type: Stealth
      minVisibility: 0.1
      lastVisibility: 0.1
  - type: PowerCellDraw
    drawRate: 1.8 # 200 seconds on the default cell
  # core ninja suit stuff
  - type: NinjaSuit
  - type: UseDelay
    delay: 5 # disable time
  - type: PowerCellSlot
    cellSlotId: cell_slot
    # throwing in a recharger would bypass glove charging mechanic
    fitsInCharger: false
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellSmall
        disableEject: true
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetHardsuitGorlexPhantom
  - type: ClothingSpeedModifier
    walkModifier: 0.95
    sprintModifier: 1
  - type: HeldSpeedModifier
  - type: Tag
    tags:
    - Hardsuit
    - FullBodyOuter
    - WhitelistChameleon

